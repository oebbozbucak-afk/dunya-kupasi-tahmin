<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><title>WC 2026</title>
<style>
    body{background:#0f172a; color:white; font-family:sans-serif; text-align:center; padding:10px;}
    .card{background:#1e293b; padding:15px; border-radius:10px; margin:10px auto; max-width:400px;}
    input{background:#0f172a; color:white; border:1px solid #475569; padding:5px; margin:5px; width:60px;}
</style></head><body>
    <div id="auth" class="card"><h3>İsimle Giriş</h3><input id="isim" placeholder="İsim" style="width:120px"><br>
    <button onclick="giris()">Giriş Yap</button></div>
    
    <div id="app" style="display:none">
        <h1>🏆 WC 2026</h1>
        <div class="card">Tarih: <input type="date" id="t" onchange="getMac()" style="width:120px"></div>
        <div id="mList"></div><button onclick="save()">Tahminleri Kaydet</button>
        <div class="card"><h2>Puan Tablosu</h2><div id="tbl"></div></div>
    </div>
    
    <script>
        window.onload = () => { let n = localStorage.getItem('isim'); if(n) start(n); };
        async function giris(){ let n = document.getElementById('isim').value; if(n) { localStorage.setItem('isim', n); start(n); } }
        async function start(n){ 
            await fetch('/api/giris', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isim:n})});
            document.getElementById('auth').style.display='none'; document.getElementById('app').style.display='block'; getMac(); 
        }
        async function getMac(){
            let m = await (await fetch('/api/maclar/'+document.getElementById('t').value)).json();
            document.getElementById('mList').innerHTML = m.map(x => `<div class='mac' data-id='${x.macId}'>${x.isim}: <input class='h' value='0'>-<input class='a' value='0'></div>`).join('');
        }
        async function save(){
            let t = {}; document.querySelectorAll('.mac').forEach(x=>{t[x.dataset.id]={home:x.querySelector('.h').value, away:x.querySelector('.a').value}});
            await fetch('/api/tahmin-kaydet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isim:localStorage.getItem('isim'), tahminler:t})});
            alert("Kaydedildi!");
        }
        fetch('/api/puan-tablosu').then(r=>r.json()).then(d=>document.getElementById('tbl').innerHTML=d.map(x=>`<div>${x.isim}: ${x.puan}</div>`).join(''));
    </script>
</body></html>
