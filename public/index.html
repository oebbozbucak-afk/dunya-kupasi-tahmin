<div id="admin" class="card" style="border:2px solid red; display:none;">
    <h3>Admin Paneli</h3>
    <textarea id="mInput" placeholder="Tarih,İsim,Id"></textarea><button onclick="toplu()">Ekle</button><br>
    <input id="mid" placeholder="ID" style="width:40px"><input id="sh" placeholder="E" style="width:30px"><input id="sa" placeholder="D" style="width:30px">
    <button onclick="skor()">Skor Gir</button><br>
    
    <hr>
    <input id="uIsim" placeholder="İsim" style="width:80px"><input id="uPuan" placeholder="Puan" style="width:40px">
    <button onclick="puanDuzenle()">Puanı Elle Değiştir</button>
</div>

<script>
    // ... diğer fonksiyonlar aynı ...
    async function puanDuzenle(){
        await fetch('/api/admin/puan-duzenle', {method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sifre:document.getElementById('sifre').value, isim:document.getElementById('uIsim').value, yeniPuan:document.getElementById('uPuan').value})});
        alert("Puan güncellendi!"); location.reload();
    }
</script>
