<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><title>WC 2026</title>
<style>
    :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
    .card { background: var(--card); padding: 20px; border-radius: 15px; margin: 15px auto; max-width: 450px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 1px solid #334155; }
    h1 { color: var(--primary); font-weight: 800; }
    input { background: #0f172a; color: white; border: 1px solid #475569; padding: 8px; margin: 5px; width: 60px; border-radius: 5px; }
    button { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.2s; margin-top: 10px; }
    button:hover { transform: scale(1.02); opacity: 0.9; }
    .mac { display: flex; align-items: center; justify-content: center; margin: 8px 0; background: #334155; padding: 10px; border-radius: 8px; }
</style></head><body>
    <div id="auth" class="card"><h3>İsimle Giriş</h3><input id="isim" style="width:120px" placeholder="İsim"><br><button onclick="giris()">Giriş Yap</button></div>
    <div id="app" style="display:none">
        <h1>🏆 WC 2026</h1>
        <div class="card">Tarih: <input type="date" id="t" onchange="getMac()" style="width:130px"></div>
        <div id="mList"></div><button onclick="save()">Tahminleri Kaydet</button>
        <div class="card">
            <h2>Turnuva Tahminleri</h2>
            <input id="s1" placeholder="1."><input id="s2" placeholder="2."><br>
            <input id="s3" placeholder="3."><input id="s4" placeholder="4."><br>
            <input id="oyuncu" placeholder="Oyuncu" style="width:120px"><br>
            <input id="kaleci" placeholder="Kaleci" style="width:120px"><br>
            <input id="genc" placeholder="Genç" style="width:120px"><br>
            <input id="golKrali" placeholder="Gol Kralı" style="width:120px"><br>
            <button onclick="saveTurnuva()">Kaydet</button>
        </div>
        <div class="card"><h2>Puan Tablosu</h2><div id="tbl"></div></div>
        <div class="card"><h2>Tahminleri Gör</h2><button onclick="tahminleriGetir()">Göster</button><div id="tahminListesi" style="text-align:left; margin-top:10px;"></div></div>
        <div id="admin" class="card" style="border:2px solid red; display:none;">
            <h3>Admin Paneli</h3><input id="sifre" type="password" placeholder="Şifre" style="width:80px"><br>
            <textarea id="mInput" placeholder="Tarih,İsim,Id"></textarea><br><button onclick="toplu()">Maç Ekle</button><hr>
            <input id="uIsim" placeholder="İsim"><button onclick="tahminSil()">Tahmin Sil</button><br>
            <input id="mid" placeholder="ID"><input id="sh" placeholder="E"><input id="sa" placeholder="D"><button onclick="skor()">Skor Gir</button>
        </div>
    </div>
    <script>
        window.onload = () => { document.getElementById('t').value = new Date().toISOString().split('T')[0]; let n = localStorage.getItem('isim'); if(n) start(n); };
        window.onkeydown=(e)=>{if(e.key==='a')document.getElementById('admin').style.display='block';};
        async function giris(){ let n = document.getElementById('isim').value; if(n) { localStorage.setItem('isim', n); start(n); } }
        async function start(n){ await fetch('/api/giris', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isim:n})}); document.getElementById('auth').style.display='none'; document.getElementById('app').style.display='block'; getMac(); }
        async function getMac(){ let m = await (await fetch('/api/maclar/'+document.getElementById('t').value)).json(); document.getElementById('mList').innerHTML = m.map(x => `<div class='mac' data-id='${x.macId}'>${x.isim}: <input class='h' value='0'>-<input class='a' value='0'></div>`).join(''); }
        async function save(){ let t = {}; document.querySelectorAll('.mac').forEach(x=>{t[x.dataset.id]={home:x.querySelector('.h').value, away:x.querySelector('.a').value}}); await fetch('/api/tahmin-kaydet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isim:localStorage.getItem('isim'), yeniTahminler:t})}); alert("Kaydedildi!"); }
        async function saveTurnuva(){ let t = {s1:document.getElementById('s1').value,s2:document.getElementById('s2').value,s3:document.getElementById('s3').value,s4:document.getElementById('s4').value,oyuncu:document.getElementById('oyuncu').value,kaleci:document.getElementById('kaleci').value,genc:document.getElementById('genc').value,golKrali:document.getElementById('golKrali').value}; await fetch('/api/turnuva-tahmin', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isim:localStorage.getItem('isim'), tahminler:t})}); alert("Kaydedildi!"); }
        async function tahminleriGetir(){ 
            let data = await (await fetch('/api/tum-tahminler')).json(); 
            document.getElementById('tahminListesi').innerHTML = data.users.map(u => {
                let t = u.turnuvaTahminleri || {};
                return `<div style="margin-bottom:15px; border-bottom:1px solid #334155; padding-bottom:5px;">
                    <b>${u.isim}:</b><br>
                    <small style='color:var(--primary)'>Şampiyon: ${t.s1 || '-'}, ${t.s2 || '-'}, ${t.s3 || '-'}, ${t.s4 || '-'}<br>
                    Ödüller: ${t.oyuncu || '-'}, ${t.kaleci || '-'}, ${t.genc || '-'}, Gol Kralı: ${t.golKrali || '-'}</small><br>
                    ${Object.keys(u.tahminler || {}).map(mId => `<span style="margin-left:10px; display:block;">${data.macHaritasi[mId] || mId}: ${u.tahminler[mId].home}-${u.tahminler[mId].away}</span>`).join('')}
                </div>`;
            }).join(''); 
        }
        async function toplu(){ let list = document.getElementById('mInput').value.split('\n'); for(let row of list){ let [tarih, isim, macId] = row.split(','); await fetch('/api/admin/mac-ekle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sifre:document.getElementById('sifre').value, mac:{tarih,isim,macId}})}); } alert("Yüklendi!"); location.reload(); }
        async function tahminSil(){ await fetch('/api/admin/tahmin-sil', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sifre:document.getElementById('sifre').value, isim:document.getElementById('uIsim').value})}); alert("Silindi!"); location.reload(); }
        async function skor(){ await fetch('/api/admin/skor-gir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sifre:document.getElementById('sifre').value, macId:document.getElementById('mid').value, homeScore:document.getElementById('sh').value, awayScore:document.getElementById('sa').value})}); alert("Skor girildi!"); location.reload(); }
        fetch('/api/puan-tablosu').then(r=>r.json()).then(d=>document.getElementById('tbl').innerHTML=d.map(x=>`<div>${x.isim}: ${x.puan}</div>`).join(''));
    </script>
</body></html>
