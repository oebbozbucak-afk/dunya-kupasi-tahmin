<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>WC 2026 Tahmin Yarışı</title>
    <style>
        :root { --primary: #10b981; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .match-row { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .score-input { width: 40px; text-align: center; background: #1e293b; color: white; border: 1px solid #334155; padding: 5px; }
        button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 WC 2026 TAHMİN YARIŞI</h1>

    <div class="card">
        <h2>📊 Genel Puan Durumu</h2>
        <table id="leaderboard" style="width:100%">
            <thead><tr><th>Oyuncu</th><th>Puan</th></tr></thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>⚽ Tahminlerini Gir</h2>
        <input type="text" id="oyuncuAdi" placeholder="Adın Soyadın" style="width:100%; padding:8px; margin-bottom:10px;">
        <div id="fiksturAlani">
            <div class="match-row" data-id="mac1"><span>Kanada-ABD</span> <div><input type="number" class="home-score"> - <input type="number" class="away-score"></div></div>
            </div>
        <button onclick="tahminKaydet()">Tahminleri Gönder</button>
    </div>

    <div class="card" style="border: 2px solid var(--primary);">
        <h2>⚙️ Admin Paneli</h2>
        <input type="password" id="adminSifre" placeholder="Admin Şifresi" style="width:100%; padding:8px; margin-bottom:10px;">
        <select id="macSec" style="width:100%; padding:8px; margin-bottom:10px;">
            <option value="mac1">Kanada-ABD</option>
            <option value="mac2">Meksika-PlayoffA</option>
        </select>
        <div style="display:flex; justify-content:center; gap:10px;">
            <input type="number" id="adminHome" placeholder="Ev" style="width:50px;">
            <input type="number" id="adminAway" placeholder="Dep" style="width:50px;">
        </div>
        <button onclick="adminPuanla()" style="background: #e11d48;">Skoru Gir ve Puanları Güncelle</button>
    </div>
</div>

<script>
    // Puanları Listele
    function puanTablosunuGetir() {
        fetch('/api/puan-tablosu').then(res => res.json()).then(data => {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = data.map(o => `<tr><td>${o.isim}</td><td>${o.puan}</td></tr>`).join('');
        });
    }

    // Tahmin Kaydet
    function tahminKaydet() {
        const isim = document.getElementById('oyuncuAdi').value;
        // ... burada tüm maçları toplayıp gönderen mantık ...
        alert("Tahminler gönderildi!");
    }

    // Admin Puanlama
    function adminPuanla() {
        const payload = {
            sifre: document.getElementById('adminSifre').value,
            macId: document.getElementById('macSec').value,
            homeScore: document.getElementById('adminHome').value,
            awayScore: document.getElementById('adminAway').value
        };

        fetch('/api/admin/mac-sonucu-gir', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(data => {
            alert(data.mesaj);
            puanTablosunuGetir();
        });
    }

    puanTablosunuGetir();
</script>
</body>
</html>
