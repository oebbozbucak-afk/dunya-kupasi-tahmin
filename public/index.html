<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Kupası 2026 Tahmin Yarışması</title>
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .leaderboard-table th {
            color: var(--primary);
            font-weight: 600;
        }
        .rank {
            font-weight: bold;
            width: 40px;
        }
        .rank-1 { color: #fbbf24; }
        .rank-2 { color: #cbd5e1; }
        .rank-3 { color: #b45309; }

        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .team-label { width: 35%; text-align: center; font-size: 14px; }
        .score-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 30%;
            justify-content: center;
        }
        .score-input {
            width: 45px;
            height: 40px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 WC 2026 TAHMİN YARIŞI 🏆</h1>

    <div class="card">
        <h2>📊 Genel Puan Durumu</h2>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th class="rank">Sıra</th>
                    <th>Oyuncu Adı</th>
                    <th style="text-align: right;">Toplam Puan</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr>
                    <td colspan="3" style="text-align: center; color: #94a3b8;">Yükleniyor...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>⚽ Tahminlerini Gir</h2>
        <form id="tahminForm">
            <div class="input-group">
                <label for="oyuncuAdi">Adın Soyadın (Gruptaki adın neyse aynısını yaz):</label>
                <input type="text" id="oyuncuAdi" placeholder="Örn: Bahadır Özbucak" required>
            </div>

            <div id="fiksturAlani">
                <div class="match-row" data-id="mac1">
                    <div class="team-label">Kanada 🇨🇦</div>
                    <div class="score-inputs">
                        <input type="number" class="score-input home-score" min="0" required>
                        <span>-</span>
                        <input type="number" class="score-input away-score" min="0" required>
                    </div>
                    <div class="team-label">🇺🇸 ABD</div>
                </div>

                <div class="match-row" data-id="mac2">
                    <div class="team-label">Meksika 🇲🇽</div>
                    <div class="score-inputs">
                        <input type="number" class="score-input home-score" min="0" required>
                        <span>-</span>
                        <input type="number" class="score-input away-score" min="0" required>
                    </div>
                    <div class="team-label">💪 Play-off A</div>
                </div>

                <div class="match-row" data-id="mac3">
                    <div class="team-label">Arjantin 🇦🇷</div>
                    <div class="score-inputs">
                        <input type="number" class="score-input home-score" min="0" required>
                        <span>-</span>
                        <input type="number" class="score-input away-score" min="0" required>
                    </div>
                    <div class="team-label">🇫🇷 Fransa</div>
                </div>

                <div class="match-row" data-id="mac4">
                    <div class="team-label">Brezilya 🇧🇷</div>
                    <div class="score-inputs">
                        <input type="number" class="score-input home-score" min="0" required>
                        <span>-</span>
                        <input type="number" class="score-input away-score" min="0" required>
                    </div>
                    <div class="team-label">🇩🇪 Almanya</div>
                </div>
            </div>

            <button type="submit" style="margin-top: 15px;">Tahminleri Kaydet / Güncelle</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        puanTablosunuGetir();
    });

    // Puan Durumunu Çeken Fonksiyon
    function puanTablosunuGetir() {
        fetch('/api/puan-tablosu')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8;">Henüz tahmin yapan olmadı. İlk sen ol!</td></tr>`;
                    return;
                }

                data.forEach((oyuncu, index) => {
                    const sira = index + 1;
                    let siraClass = "";
                    if(sira === 1) siraClass = "rank-1";
                    if(sira === 2) siraClass = "rank-2";
                    if(sira === 3) siraClass = "rank-3";

                    tbody.innerHTML += `
                        <tr>
                            <td class="rank ${siraClass}">#${sira}</td>
                            <td style="font-weight: 500;">${oyuncu.isim}</td>
                            <td style="text-align: right; font-weight: bold; color: #10b981;">${oyuncu.puan} Puan</td>
                        </tr>
                    `;
                });
            })
            .catch(err => {
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #f87171;">Bağlantı bekleniyor...</td></tr>`;
            });
    }

    // Form Gönderme Fonksiyonu
    document.getElementById('tahminForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const isim = document.getElementById('oyuncuAdi').value.trim();
        const macRows = document.querySelectorAll('.match-row');
        const tahminler = {};

        macRows.forEach(row => {
            const macId = row.getAttribute('data-id');
            const homeScore = row.querySelector('.home-score').value;
            const awayScore = row.querySelector('.away-score').value;

            tahminler[macId] = {
                home: Number(homeScore),
                away: Number(awayScore)
            };
        });

        fetch('/api/tahmin-kaydet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ isim, tahminler })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.mesaj);
            puanTablosunuGetir();
        })
        .catch(err => alert("Tahmin kaydedilirken bir bağlantı hatası oluştu!"));
    });
</script>

</body>
</html>
